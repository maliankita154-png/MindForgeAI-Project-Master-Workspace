<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AETHERA - Page Not Found</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .error-box {
            background: white;
            padding: 45px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 64px;
            margin: 0;
            color: #1f6feb;
        }

        h2 {
            margin: 10px 0;
            color: #222;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #1f6feb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="error-box">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            The requested AETHERA page could not be found.
        </p>

        <a href="/dashboard">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
