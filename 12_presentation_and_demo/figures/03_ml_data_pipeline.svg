<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>.bg{fill:#f6f6f1}.title{font:700 48px Georgia,serif;fill:#102327}.sub{font:18px Arial,sans-serif;fill:#607275}.b{fill:#fff;stroke:#d9e0db;stroke-width:2}.n{font:13px Arial,sans-serif;fill:#157f91}.h{font:700 23px Arial,sans-serif;fill:#102327}.t{font:15px Arial,sans-serif;fill:#607275}.a{stroke:#33aabd;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11z" fill="#33aabd"/></marker></defs><rect class="bg" width="1600" height="900"/><text x="100" y="105" class="title">Responsible ML workflow</text><text x="100" y="145" class="sub">Build evidence before algorithms—and compare every model with a simple baseline</text><g><rect class="b" x="100" y="300" width="220" height="210" rx="14"/><rect class="b" x="390" y="300" width="220" height="210" rx="14"/><rect class="b" x="680" y="300" width="220" height="210" rx="14"/><rect class="b" x="970" y="300" width="220" height="210" rx="14"/><rect class="b" x="1260" y="300" width="220" height="210" rx="14"/></g><g><text x="130" y="345" class="n">01 / DECISION</text><text x="130" y="385" class="h">Define</text><text x="130" y="420" class="t">What decision?</text><text x="130" y="446" class="t">What target?</text><text x="420" y="345" class="n">02 / DATA</text><text x="420" y="385" class="h">Validate</text><text x="420" y="420" class="t">Sources · units</text><text x="420" y="446" class="t">Missingness · quality</text><text x="710" y="345" class="n">03 / BASELINE</text><text x="710" y="385" class="h">Compare</text><text x="710" y="420" class="t">Seasonal naive</text><text x="710" y="446" class="t">Time-based split</text><text x="1000" y="345" class="n">04 / MODEL</text><text x="1000" y="385" class="h">Forecast</text><text x="1000" y="420" class="t">Features · metrics</text><text x="1000" y="446" class="t">Uncertainty</text><text x="1290" y="345" class="n">05 / REVIEW</text><text x="1290" y="385" class="h">Govern</text><text x="1290" y="420" class="t">Model card</text><text x="1290" y="446" class="t">Human approval</text></g><path class="a" d="M320 405h60m230 0h60m230 0h60m230 0h60"/><rect x="310" y="625" width="980" height="95" rx="12" fill="#e1f3e9"/><text x="360" y="680" font-family="Georgia,serif" font-size="28" fill="#102327">Never random-shuffle time series. Never train on data from the future.</text><text x="100" y="830" class="sub">Figure 3. The first acceptable model is reproducible, evaluated on future data and documented with limitations.</text></svg>
