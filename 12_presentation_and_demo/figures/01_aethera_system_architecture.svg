<rect class="box" x="780" y="235" width="255" height="190" rx="12"/><text x="810" y="285" class="tag">03 / UNDERSTAND</text><text x="810" y="325" class="h">Intelligence</text><text x="810" y="360" class="t">Forecasting · GIS</text><text x="810" y="387" class="t">Uncertainty · scenarios</text>
